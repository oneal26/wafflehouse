<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waffle House Simulator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="landing-page">
    <div class="neon-sign">
        <h1 class="waffle-house-title">
            <span class="waffle">WAFFLE</span>
            <span class="house">HOUSE</span>
        </h1>
        <p class="subtitle">A Place of Zen, Chaos, and Hash Browns</p>
    </div>

    <div class="auth-container">
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Login</button>
            <button class="auth-tab" data-tab="register">Register</button>
        </div>

        <div class="auth-form active" id="login-form">
            <h2>Welcome Back</h2>
            <form id="login">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="btn-yellow">Enter the Waffle House</button>
            </form>
        </div>

        <div class="auth-form" id="register-form">
            <h2>Join the Crew</h2>
            <form id="register">
                <input type="text" name="username" placeholder="Choose Username" required>
                <input type="password" name="password" placeholder="Choose Password" required>
                <button type="submit" class="btn-yellow">Start Your Shift</button>
            </form>
        </div>

        <div class="error-message" id="error-message"></div>
    </div>

    <div class="landing-footer">
        <p>Open 24/7 · Always There When You Need It</p>
    </div>

    <script>
        // Tab switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.dataset.tab;
                
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(`${targetTab}-form`).classList.add('active');
                document.getElementById('error-message').textContent = '';
            });
        });

        // Login form
        document.getElementById('login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    document.getElementById('error-message').textContent = data.error;
                }
            } catch (error) {
                document.getElementById('error-message').textContent = 'Connection error';
            }
        });

        // Register form
        document.getElementById('register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    document.getElementById('error-message').textContent = data.error;
                }
            } catch (error) {
                document.getElementById('error-message').textContent = 'Connection error';
            }
        });
    </script>
</body>
</html>
